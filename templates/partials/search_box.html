<form action="{% url 'storefront:search' %}" method="get" role="search" class="relative">
  <span class="pointer-events-none absolute inset-y-0 start-3 grid place-items-center text-slate-500">
    {% include "partials/icon.html" with name="search" %}
  </span>
  <input name="q" type="search" autocomplete="off" value="{{ search_query|default:'' }}" minlength="2" aria-label="جست‌وجو" data-search-input
         class="w-full rounded-lg bg-slate-100 py-2.5 ps-10 pe-3 text-sm outline-none ring-brand-200 transition placeholder:text-slate-400 focus:bg-white focus:ring-2"
         placeholder="جست‌وجو در اشتراک‌ها؛ مثلاً «جمینای» یا ChatGPT">
  <div class="absolute inset-x-0 top-full z-50 mt-1 hidden overflow-hidden rounded-xl border border-slate-200 bg-white shadow-lg" data-search-panel>
    <p class="px-4 pt-3 text-xs font-bold text-slate-500">پیشنهادها</p>
    <ul class="py-1 text-sm" data-search-results></ul>
  </div>
</form>
